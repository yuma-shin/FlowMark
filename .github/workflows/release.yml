name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # macOS ビルド
  # ------------------------------------------------------------------
  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish (universal macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notyra ${{ github.ref_name }}"
          releaseBody: "See the assets below to download Notyra for your platform."
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      - name: Create and upload macOS ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          APP_DIR="${GITHUB_WORKSPACE}/src-tauri/target/universal-apple-darwin/release/bundle/macos"
          ZIP_NAME="Notyra_${VERSION}_universal.zip"
          APP_FILE=$(find "${APP_DIR}" -maxdepth 1 -type d -name "*.app" | head -1)
          if [ -z "$APP_FILE" ]; then
            echo "ERROR: No .app found in ${APP_DIR}"
            ls -la "${APP_DIR}" || true
            exit 1
          fi
          ditto -c -k --keepParent "${APP_FILE}" "${GITHUB_WORKSPACE}/${ZIP_NAME}"
          gh release upload "${{ github.ref_name }}" "${ZIP_NAME}" --clobber

  # ------------------------------------------------------------------
  # Windows ビルド
  # ------------------------------------------------------------------
  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notyra ${{ github.ref_name }}"
          releaseBody: "See the assets below to download Notyra for your platform."
          releaseDraft: true
          prerelease: false

      - name: Create and upload Windows portable and ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $tagName = "${{ github.ref_name }}"

          # ポータブル版: ビルド済みバイナリをそのまま配布
          $portableName = "Notyra_${version}_x64-portable.exe"
          Copy-Item "src-tauri\target\release\notyra.exe" $portableName

          # ZIP版: ポータブルバイナリを圧縮
          $zipName = "Notyra_${version}_x64.zip"
          Compress-Archive -Path $portableName -DestinationPath $zipName

          gh release upload $tagName $portableName $zipName --clobber

  # ------------------------------------------------------------------
  # Linux ビルド（macOS/Windows のドラフト作成完了後に実行）
  # ------------------------------------------------------------------
  release-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-macos, release-windows]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notyra ${{ github.ref_name }}"
          releaseBody: "See the assets below to download Notyra for your platform."
          releaseDraft: true
          prerelease: false
